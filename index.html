<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Avatar Experiencia XR Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
    
    #loading-screen {
      position: absolute;
      z-index: 9999;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #1a1a2e;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease-out;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top-color: #0f3460;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    .loading-text { color: white; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
  </style>

  <script>
    // Pantalla de Carga
    AFRAME.registerComponent('loading-manager', {
      init: function () {
        this.el.addEventListener('loaded', () => {
          const loadingScreen = document.getElementById('loading-screen');
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 800);
        });
      }
    });

    // Sistema Híbrido AR/VR
    AFRAME.registerComponent('xr-manager', {
      init: function () {
        const scene = this.el.sceneEl;
        const virtualEnvironment = document.getElementById('virtual-environment');
        const reticle = document.getElementById('reticle');
        const avatarWrapper = document.getElementById('avatar-wrapper');

        scene.addEventListener('enter-vr', () => {
          if (scene.is('ar-mode')) {
            virtualEnvironment.setAttribute('visible', 'false');
            avatarWrapper.setAttribute('visible', 'false');
            reticle.setAttribute('visible', 'true');
          }
        });

        scene.addEventListener('exit-vr', () => {
          virtualEnvironment.setAttribute('visible', 'true');
          avatarWrapper.setAttribute('visible', 'true');
          avatarWrapper.setAttribute('position', '0 0 -2');
          reticle.setAttribute('visible', 'false');
        });

        // Colocar el avatar en la posición de la retícula
        scene.addEventListener('select', () => {
          if (!scene.is('ar-mode')) return;
          if (reticle.getAttribute('visible')) {
            const pos = reticle.getAttribute('position');
            avatarWrapper.setAttribute('position', pos);
            avatarWrapper.setAttribute('visible', 'true');
          }
        });
      }
    });

    // Gestos Inteligentes
    AFRAME.registerComponent('smart-gestures', {
      init: function () {
        let initialDistance = 0;
        let initialScale = this.el.object3D.scale.clone();
        let isDragging = false;
        let previousTouch = null;
        let lookAtActive = true;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            initialDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            initialScale = this.el.object3D.scale.clone();
          } else if (e.touches.length === 1) {
            isDragging = true;
            previousTouch = e.touches[0];
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            const currentDistance = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
            const scaleFactor = currentDistance / initialDistance;
            const finalScale = Math.max(0.5, Math.min(2.5, initialScale.x * scaleFactor));
            this.el.object3D.scale.set(finalScale, finalScale, finalScale);
          } else if (e.touches.length === 1 && isDragging) {
            const deltaX = e.touches[0].pageX - previousTouch.pageX;
            this.el.object3D.rotation.y += deltaX * 0.01;
            previousTouch = e.touches[0];

            if (lookAtActive) {
              this.el.removeAttribute('look-at');
              lookAtActive = false;
            }
          }
        });

        window.addEventListener('touchend', () => isDragging = false);
      }
    });
  </script>
</head>
<body>

  <div id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Cargando Experiencia...</div>
  </div>

  <a-scene
    xr-manager
    webxr="optionalFeatures: hit-test;"
    ar-hit-test="target: #reticle;"
    renderer="colorManagement: true; physicallyCorrectLights: true; toneMapping: ACESFilmic;"
    shadow="type: pcfsoft"
  >
    <a-assets loading-manager>
      <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/Josema35RJ/Avatar@main/3dpea.com_Salute.glb"></a-asset-item>
    </a-assets>

    <a-entity camera position="0 1.6 1.5" look-controls="enabled: false"></a-entity>

    <a-light type="directional" intensity="1.5" position="2 4 3" castShadow="true" shadow-mapSize="2048 2048"></a-light>
    <a-light type="directional" intensity="0.5" position="-2 2 -2" color="#b4c6ef"></a-light>
    <a-light type="ambient" intensity="0.4" color="#ffffff"></a-light>

    <a-entity 
      id="virtual-environment" 
      environment="preset: forest; lighting: none; shadow: true;">
    </a-entity>

    <a-entity id="reticle" visible="false">
      <a-ring color="#00FFFF" radius-inner="0.1" radius-outer="0.15" rotation="-90 0 0" material="opacity: 0.8; transparent: true;"></a-ring>
      <a-circle color="#00FFFF" radius="0.03" rotation="-90 0 0" material="opacity: 0.8; transparent: true;"></a-circle>
    </a-entity>

    <a-entity id="avatar-wrapper" position="0 0 -2">
      <a-entity
        id="avatar"
        gltf-model="#avatarModel"
        scale="1 1 1"
        animation-mixer="clip: *; loop: repeat"
        look-at="[camera]"
        smart-gestures
        shadow="cast: true; receive: false"
      ></a-entity>
      <a-plane rotation="-90 0 0" width="1.5" height="1.5" shadow="receive: true" material="opacity: 0.3; transparent: true; color: #000; depthWrite: false;"></a-plane>
    </a-entity>

  </a-scene>

</body>
</html>
