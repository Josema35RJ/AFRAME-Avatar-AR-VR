<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Avatar VR / AR Profesional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

  <script>
    // 1. Componente para ocultar el entorno virtual al entrar en Realidad Aumentada (cámara passthrough)
    AFRAME.registerComponent('hide-in-ar', {
      init: function () {
        this.el.sceneEl.addEventListener('enter-vr', () => {
          if (this.el.sceneEl.is('ar-mode')) {
            this.el.setAttribute('visible', false);
          }
        });
        this.el.sceneEl.addEventListener('exit-vr', () => {
          this.el.setAttribute('visible', true);
        });
      }
    });

    // 2. Componente autónomo para rotar (1 dedo) y escalar (2 dedos) el avatar
    AFRAME.registerComponent('touch-gestures', {
      init: function () {
        let initialDistance = 0;
        let initialScale = this.el.object3D.scale.clone();
        let isDragging = false;
        let previousTouch = null;

        window.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            initialDistance = Math.hypot(
              e.touches[0].pageX - e.touches[1].pageX,
              e.touches[0].pageY - e.touches[1].pageY
            );
            initialScale = this.el.object3D.scale.clone();
          } else if (e.touches.length === 1) {
            isDragging = true;
            previousTouch = e.touches[0];
          }
        });

        window.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            // Escalar (Pellizcar / Pinch to zoom)
            const currentDistance = Math.hypot(
              e.touches[0].pageX - e.touches[1].pageX,
              e.touches[0].pageY - e.touches[1].pageY
            );
            const scaleFactor = currentDistance / initialDistance;
            // Limitamos la escala para que no se haga microscópico o gigante
            const finalScale = Math.max(0.2, Math.min(3.0, initialScale.x * scaleFactor));
            this.el.object3D.scale.set(finalScale, finalScale, finalScale);
            
          } else if (e.touches.length === 1 && isDragging) {
            // Rotar (Deslizar un dedo / Swipe)
            const deltaX = e.touches[0].pageX - previousTouch.pageX;
            this.el.object3D.rotation.y += deltaX * 0.01;
            previousTouch = e.touches[0];
          }
        });

        window.addEventListener('touchend', () => {
          isDragging = false;
        });
      }
    });
  </script>

  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>

<a-scene
  webxr="optionalFeatures: hit-test;"
  renderer="colorManagement: true; antialias: true; physicallyCorrectLights: true"
  shadow="type: pcfsoft"
>
  <a-assets>
    <a-asset-item id="avatarModel" src="https://cdn.jsdelivr.net/gh/Josema35RJ/Avatar@main/3dpea.com_Salute.glb"></a-asset-item>
  </a-assets>

  <a-entity camera position="0 1.6 2" look-controls></a-entity>

  <a-light type="directional" intensity="1.2" position="1 4 2" castShadow="true"></a-light>
  <a-light type="ambient" intensity="0.5" color="#ffffff"></a-light>

  <a-entity hide-in-ar>
    <a-plane rotation="-90 0 0" width="20" height="20" color="#7BC8A4" shadow="receive: true"></a-plane>
    <a-sky color="#ECECEC"></a-sky>
  </a-entity>

  <a-entity
    id="avatar"
    gltf-model="#avatarModel"
    scale="1 1 1"
    position="0 0 -2"
    animation-mixer="clip: *; loop: repeat"
    look-at="[camera]"
    touch-gestures
    shadow="cast: true; receive: false"
  ></a-entity>

</a-scene>

</body>
</html>
